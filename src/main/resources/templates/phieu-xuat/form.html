<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Phiếu Xuất - Quản Lý Kho</title>

    <!-- AdminLTE 4 & Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- Main Content -->
        <main class="app-main p-4">
            <div class="app-content-header mb-4">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h3 class="mb-0">Tạo Phiếu Xuất Kho</h3>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-end">
                                <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
                                <li class="breadcrumb-item"><a href="/phieu-xuat">Phiếu Xuất</a></li>
                                <li class="breadcrumb-item active">Tạo mới</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <div class="app-content">
                <div class="container-fluid">
                    <!-- Hiển thị thông báo thành công hoặc lỗi từ RedirectAttributes -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- AdminLTE Card Form -->
                    <div class="card card-primary card-outline mb-4">
                        <div class="card-header">
                            <div class="card-title"><i class="bi bi-box-arrow-right me-2"></i>Thông Tin Phiếu Xuất</div>
                        </div>

                        <!-- Form binding object phieuXuatRequest -->
                        <form th:action="@{/phieu-xuat/create}" th:object="${phieuXuatRequest}" method="post">
                            <div class="card-body">
                                <div class="row g-3">
                                    <!-- Mã/ID Sản phẩm -->
                                    <div class="col-md-6">
                                        <label for="sanPhamId" class="form-label">Mã Sản Phẩm / Sản Phẩm <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" id="sanPhamId" th:field="*{sanPhamId}" placeholder="Nhập ID sản phẩm xuất" required>
                                    </div>

                                    <!-- Số lượng xuất -->
                                    <div class="col-md-6">
                                        <label for="soLuong" class="form-label">Số Lượng Xuất <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" id="soLuong" th:field="*{soLuong}" min="1" placeholder="Nhập số lượng xuất kho" required>
                                    </div>

                                    <!-- Ghi chú hoặc Thông tin thêm (nếu DTO có thuộc tính ghiChu/lyDo) -->
                                    <div class="col-12">
                                        <label for="ghiChu" class="form-label">Ghi Chú / Lý Do Xuất</label>
                                        <textarea class="form-control" id="ghiChu" th:field="*{ghiChu}" rows="3" placeholder="Nhập lý do xuất hàng hoặc thông tin khách hàng/đối tác..."></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer d-flex justify-content-between">
                                <a href="/phieu-xuat" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i> Xuất Kho (FIFO)
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
</body>
</html>
