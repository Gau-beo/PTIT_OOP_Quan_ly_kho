<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: header('Trang chủ')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container">
    <div class="card">
        <div class="card-body p-4">
            <h2 class="fw-bold">Chào mừng đến với hệ thống quản lý kho</h2>
            <p class="text-muted">
                Đăng nhập với tài khoản <strong sec:authentication="name"></strong>
                <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger ms-1">ADMIN</span>
                <span sec:authorize="!hasRole('ADMIN')" class="badge bg-primary ms-1">USER</span>
            </p>
            <a th:href="@{/thong-ke}" class="btn btn-primary">
                <i class="bi bi-graph-up-arrow me-1"></i>Xem báo cáo & thống kê
            </a>
			<a sec:authorize="hasAnyRole('USER','ADMIN')" th:href="@{/user}" class="btn btn-outline-primary ms-2">
			    <i class="bi bi-person me-1"></i>Người dùng
			</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
