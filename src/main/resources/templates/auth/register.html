<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: header('Đăng ký')}"></head>
<body>

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">
                <i class="bi bi-box-seam-fill text-warning" style="font-size: 3rem;"></i>
                <h4 class="fw-bold mt-2 mb-0">PTIT - QUẢN LÝ KHO</h4>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="text-center fw-bold mb-4 text-dark">Đăng ký tài khoản</h4>

                    <!-- Thông báo lỗi -->
                    <div th:if="${loi}" class="alert alert-danger d-flex align-items-center gap-2" th:text="${loi}"></div>
                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2" th:text="${error}"></div>

                    <form th:action="@{/register}" method="post" id="formDangKy">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ tên</label>
                            <input type="text" name="hoTen" class="form-control"
                                   placeholder="Nhập họ tên" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control"
                                   placeholder="Nhập email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password" name="matKhau" id="matKhau" class="form-control"
                                   placeholder="Nhập mật khẩu (ít nhất 6 ký tự)" minlength="6" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" id="xacNhan" class="form-control"
                                   placeholder="Nhập lại mật khẩu" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ</label>
                            <input type="text" name="diaChi" class="form-control"
                                   placeholder="Nhập địa chỉ" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                            <i class="bi bi-person-plus me-1"></i>Đăng ký
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-2 border-top">
                        <span class="text-muted">Đã có tài khoản?</span>
                        <a th:href="@{/login}" class="fw-semibold text-success text-decoration-none ms-1">Đăng nhập</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {
    $("#formDangKy").submit(function (e) {
        let matKhau = $("#matKhau").val();
        let xacNhan = $("#xacNhan").val();

        if (matKhau !== xacNhan) {
            alert("Mật khẩu xác nhận không khớp!");
            $("#xacNhan").focus();
            e.preventDefault();
            return false;
        }
        return true;
    });
});
</script>

</body>
</html>
