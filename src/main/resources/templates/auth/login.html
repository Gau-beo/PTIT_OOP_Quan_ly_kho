<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: header('Đăng nhập')}"></head>
<body>

<div class="container">
    <div class="row justify-content-center mt-5 pt-4">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <i class="bi bi-box-seam-fill text-warning" style="font-size: 3rem;"></i>
                <h4 class="fw-bold mt-2 mb-0">PTIT - QUẢN LÝ KHO</h4>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="text-center fw-bold mb-4 text-dark">Đăng nhập</h4>

                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>Email hoặc mật khẩu không đúng!</span>
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>Bạn đã đăng xuất thành công!</span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="username" class="form-control"
                                       placeholder="Nhập email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Nhập mật khẩu" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-2 border-top">
                        <span class="text-muted">Chưa có tài khoản?</span>
                        <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none ms-1">Đăng ký</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
