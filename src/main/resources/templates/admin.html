<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: header('Quản trị')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container pb-5">
    <h3 class="fw-bold text-danger mb-1"><i class="bi bi-shield-lock me-2"></i>Trang quản trị Admin</h3>
    <p class="text-muted">Chỉ tài khoản ADMIN mới truy cập được trang này. Đang đăng nhập:
        <strong sec:authentication="name"></strong></p>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold"><i class="bi bi-people me-2"></i>Danh sách tài khoản hệ thống</span>
            <span class="badge bg-secondary" th:text="${danhSachTaiKhoan.size()} + ' tài khoản'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Loại tài khoản</th><th class="text-end">Thao tác</th></tr>
                </thead>
                <tbody>
                    <tr th:each="nd : ${danhSachTaiKhoan}">
                        <td th:text="${nd.id}"></td>
                        <td class="fw-semibold" th:text="${nd.hoTen}"></td>
                        <td th:text="${nd.email}"></td>
                        <td>
                            <span th:class="${nd.vaiTro == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-primary'" th:text="${nd.vaiTro}"></span>
                        </td>
                        <td th:text="${nd.moTaTaiKhoan}"></td>
                        <td class="text-end">
                            <form th:if="${nd.vaiTro != 'ADMIN'}" th:action="@{/admin/xoa/{id}(id=${nd.id})}" method="post"
                                  class="d-inline" onsubmit="return confirm('Xóa tài khoản này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/home}" class="btn btn-primary mt-4"><i class="bi bi-house me-1"></i>Về trang chủ</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
