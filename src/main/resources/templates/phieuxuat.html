<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: header('Quản lý Phiếu Xuất')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-box-arrow-up text-danger me-2"></i>Quản Lý Phiếu Xuất</h3>
            <p class="text-muted mb-0">Hệ thống tự trừ tồn kho theo nguyên tắc FEFO (lô hết hạn sớm nhất xuất trước), bỏ qua lô đã hết hạn</p>
        </div>
        <button type="button" sec:authorize="hasAnyRole('ADMIN', 'QUAN_LY')" class="btn btn-danger shadow-sm" data-bs-toggle="modal" data-bs-target="#modalPhieuXuat">
            <i class="bi bi-plus-circle me-1"></i> Tạo phiếu xuất
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold"><i class="bi bi-list-check me-2"></i>Danh sách phiếu xuất</span>
            <span class="badge bg-secondary" th:text="${danhSachPhieuXuat.size()} + ' phiếu'"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Mã phiếu</th>
                            <th>Ngày xuất</th>
                            <th>Người nhận</th>
                            <th>Người lập phiếu</th>
                            <th>Chi tiết hàng xuất</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="px : ${danhSachPhieuXuat}">
                            <td class="fw-bold text-danger" th:text="'PX-' + ${px.id}"></td>
                            <td th:text="${#temporals.format(px.ngayXuat, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${px.nguoiNhan}"></td>
                            <td th:text="${px.nguoiTao != null ? px.nguoiTao.hoTen : '-'}"></td>
                            <td>
                                <div th:each="ct : ${px.chiTietList}" class="small">
                                    <span class="fw-semibold" th:text="${ct.sanPham.tenSanPham}"></span>
                                    &times; <strong th:text="${ct.soLuong}"></strong>
                                    <span class="text-muted" th:text="${ct.sanPham.donViTinh}"></span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhSachPhieuXuat)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>Chưa có phiếu xuất nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPhieuXuat" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/phieuxuat/them}" method="post">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-box-arrow-up me-2"></i>Tạo phiếu xuất mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Người nhận hàng <span class="text-danger">*</span></label>
                        <input type="text" name="nguoiNhan" class="form-control" placeholder="Tên người / đơn vị nhận hàng" required>
                    </div>
                    <table class="table table-sm align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 65%;">Sản phẩm (tồn khả dụng)</th>
                                <th>Số lượng xuất</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="dongXuat"></tbody>
                    </table>
                    <button type="button" id="btnThemDong" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-plus-lg me-1"></i>Thêm dòng sản phẩm
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-save me-1"></i> Lưu phiếu xuất</button>
                </div>
            </form>
        </div>
    </div>
</div>

<template id="tplDong">
    <tr>
        <td>
            <select name="sanPhamId" class="form-select form-select-sm" required>
                <option value="" disabled selected>-- Chọn sản phẩm --</option>
                <option th:each="sp : ${danhSachSanPham}" th:value="${sp.id}" th:disabled="${sp.tonKhoKhaDung == 0}"
                        th:text="${sp.maSanPham + ' - ' + sp.tenSanPham + ' (khả dụng: ' + sp.tonKhoKhaDung + ' ' + sp.donViTinh + ')'}"></option>
            </select>
        </td>
        <td><input type="number" name="soLuong" class="form-control form-control-sm" min="1" value="1" required></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger btn-xoa-dong" title="Xóa dòng"><i class="bi bi-x-lg"></i></button></td>
    </tr>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var tbody = document.getElementById('dongXuat');
        var tpl = document.getElementById('tplDong');
        function themDong() { tbody.appendChild(tpl.content.cloneNode(true)); }
        document.getElementById('btnThemDong').addEventListener('click', themDong);
        tbody.addEventListener('click', function (e) {
            var btn = e.target.closest('.btn-xoa-dong');
            if (btn && tbody.rows.length > 1) { btn.closest('tr').remove(); }
        });
        themDong();
    })();
</script>
</body>
</html>
