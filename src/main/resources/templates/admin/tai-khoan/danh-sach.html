<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: header('Quản lý tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-danger mb-1"><i class="bi bi-people-fill me-2"></i>Quản lý tài khoản người dùng</h3>
            <p class="text-muted mb-0">Quản trị viên có thể xem, thêm mới, phân quyền và cập nhật tài khoản.</p>
        </div>
        <a th:href="@{/admin/tai-khoan/them}" class="btn btn-primary shadow-sm">
            <i class="bi bi-person-plus-fill me-1"></i>Thêm tài khoản mới
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Tìm kiếm theo họ tên hoặc email...">
                    </div>
                </div>
                <div class="col-md-7 text-md-end mt-2 mt-md-0">
                    <span class="badge bg-secondary fs-6" th:text="${danhSachTaiKhoan.size()} + ' tài khoản'"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="accountTable">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3" style="width: 70px;">ID</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Loại tài khoản (OOP)</th>
                            <th class="text-end pe-3" style="width: 140px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tk : ${danhSachTaiKhoan}">
                            <td class="ps-3 fw-bold text-muted" th:text="${tk.id}"></td>
                            <td class="fw-semibold" th:text="${tk.hoTen}"></td>
                            <td th:text="${tk.email}"></td>
                            <td>
                                <span th:if="${tk.vaiTro == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                                <span th:if="${tk.vaiTro == 'QUAN_LY'}" class="badge bg-warning text-dark">QUẢN LÝ</span>
                                <span th:if="${tk.vaiTro == 'USER'}" class="badge bg-primary">NGƯỜI DÙNG</span>
                            </td>
                            <td class="text-secondary small" th:text="${tk.moTaTaiKhoan}"></td>
                            <td class="text-end pe-3">
                                <a th:href="@{/admin/tai-khoan/sua/{id}(id=${tk.id})}" class="btn btn-sm btn-outline-primary me-1" title="Sửa thông tin">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <form th:if="${tk.vaiTro != 'ADMIN'}" th:action="@{/admin/tai-khoan/xoa/{id}(id=${tk.id})}" method="post"
                                      class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa tài khoản này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa tài khoản">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhSachTaiKhoan)}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có tài khoản nào trong hệ thống.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("searchInput").addEventListener("input", function() {
        const keyword = this.value.toLowerCase().trim();
        const rows = document.querySelectorAll("#accountTable tbody tr");
        rows.forEach(row => {
            if (row.cells.length < 6) return;
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(keyword) ? "" : "none";
        });
    });
</script>
</body>
</html>
