<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: header('Chỉnh sửa tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h5 class="card-title fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>Chỉnh sửa tài khoản</h5>
                </div>
                <form th:action="@{/admin/tai-khoan/sua}" method="post">
                    <input type="hidden" name="id" th:value="${taiKhoan?.id}">
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}"></div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">ID tài khoản</label>
                            <input class="form-control bg-light" th:value="${taiKhoan?.id}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input name="hoTen" class="form-control" th:value="${taiKhoan?.hoTen}" placeholder="Nhập họ và tên đầy đủ" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input name="email" type="email" class="form-control" th:value="${taiKhoan?.email}" placeholder="example@ptit.edu.vn" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu mới (Tùy chọn)</label>
                            <input name="matKhau" type="password" class="form-control" placeholder="Để trống nếu muốn giữ nguyên mật khẩu cũ">
                            <div class="form-text text-muted">Chỉ nhập nếu bạn muốn đổi mật khẩu mới cho người này (tối thiểu 6 ký tự).</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Vai trò <span class="text-danger">*</span></label>
                            <select name="vaiTro" class="form-select" required>
                                <option value="USER" th:selected="${taiKhoan?.vaiTro == 'USER'}">USER (Người dùng / Nhân viên xuất kho)</option>
                                <option value="QUAN_LY" th:selected="${taiKhoan?.vaiTro == 'QUAN_LY'}">QUAN_LY (Quản lý kho)</option>
                                <option value="ADMIN" th:selected="${taiKhoan?.vaiTro == 'ADMIN'}">ADMIN (Quản trị viên toàn quyền)</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-footer bg-light d-flex justify-content-between py-3">
                        <a th:href="@{/admin/tai-khoan/danh-sach}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check2-circle me-1"></i>Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
