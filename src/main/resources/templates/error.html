<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: header('Có lỗi xảy ra')}"></head>
<body>
<div class="container">
    <div class="row justify-content-center mt-5 pt-4">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-octagon text-danger" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Có lỗi xảy ra</h3>
                    <p class="text-muted mb-1">
                        Mã lỗi: <strong th:text="${status}">500</strong>
                        <span th:text="${error}"></span>
                    </p>
                    <p th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}" class="text-break"></p>
                    <a th:href="@{/}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i>Về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
