<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng ký</title>

    <!-- Bootstrap online -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Đăng ký tài khoản
                    </h2>


                    <!-- Lỗi -->

                    <div
                        th:if="${loi}"
                        class="alert alert-danger"
                        th:text="${loi}">
                    </div>


                    <!-- FORM REGISTER -->

                    <form
                        action="/register"
                        method="post">

                        <!-- CSRF -->

                        <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">


                        <!-- HỌ TÊN -->

                        <div class="mb-3">

                            <label class="form-label">
                                Họ tên
                            </label>

                            <input
                                type="text"
                                name="hoTen"
                                class="form-control"
                                placeholder="Nhập họ tên"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Nhập email"
                                required>

                        </div>


                        <!-- MẬT KHẨU -->

                        <div class="mb-3">

                            <label class="form-label">
                                Mật khẩu
                            </label>

                            <input
                                type="password"
                                name="matKhau"
                                id="matKhau"
                                class="form-control"
                                placeholder="Nhập mật khẩu"
                                required>

                        </div>


                        <!-- XÁC NHẬN -->

                        <div class="mb-3">

                            <label class="form-label">
                                Xác nhận mật khẩu
                            </label>

                            <input
                                type="password"
                                id="xacNhan"
                                class="form-control"
                                placeholder="Nhập lại mật khẩu"
                                required>

                        </div>


                        <!-- ĐỊA CHỈ -->

                        <div class="mb-3">

                            <label class="form-label">
                                Địa chỉ
                            </label>

                            <input
                                type="text"
                                name="diaChi"
                                class="form-control"
                                placeholder="Nhập địa chỉ"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Đăng ký

                        </button>

                    </form>


                    <div class="text-center mt-3">

                        Đã có tài khoản?

                        <a href="/login">
                            Đăng nhập
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- jQuery -->

<script
    src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

$(document).ready(function () {

    $("form").submit(function () {

        let matKhau = $("#matKhau").val();

        let xacNhan = $("#xacNhan").val();

        if (matKhau !== xacNhan) {

            alert("Mật khẩu xác nhận không khớp!");

            return false;
        }

        return true;
    });

});

</script>

</body>

</html>
