<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: header('Đăng ký')}"></head>
<body>

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">
                <i class="bi bi-box-seam-fill text-warning" style="font-size: 3rem;"></i>
                <h4 class="fw-bold mt-2 mb-0">PTIT - QUẢN LÝ KHO</h4>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <h4 class="text-center fw-bold mb-4">Đăng ký tài khoản</h4>

                    <!-- Lỗi -->
                    <div th:if="${loi}" class="alert alert-danger" th:text="${loi}"></div>

                    <form action="/register" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Họ tên</label>
                            <input type="text" name="hoTen" class="form-control"
                                   placeholder="Nhập họ tên" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control"
                                   placeholder="Nhập email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="matKhau" id="matKhau" class="form-control"
                                   placeholder="Nhập mật khẩu" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" id="xacNhan" class="form-control"
                                   placeholder="Nhập lại mật khẩu" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" name="diaChi" class="form-control"
                                   placeholder="Nhập địa chỉ" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-person-plus me-1"></i>Đăng ký
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        Đã có tài khoản? <a href="/login">Đăng nhập</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {
    $("form").submit(function () {
        let matKhau = $("#matKhau").val();
        let xacNhan = $("#xacNhan").val();

        if (matKhau !== xacNhan) {
            alert("Mật khẩu xác nhận không khớp!");
            return false;
        }
        return true;
    });
});
</script>

</body>
</html>
