<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Quản Lý Kho PTIT'">Quản Lý Kho PTIT</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #334155;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .navbar-custom .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            padding: 0.5rem 0.8rem;
            white-space: nowrap;
            border-radius: 0.375rem;
            transition: all 0.2s ease;
        }
        .navbar-custom .nav-link:hover, .navbar-custom .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }
        .card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            border-top-left-radius: 0.75rem !important;
            border-top-right-radius: 0.75rem !important;
            font-weight: 600;
        }
        .table thead th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }
        .stat-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-xl navbar-dark navbar-custom sticky-top mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-box-seam-fill fs-4 text-warning"></i>
                <span>PTIT - QUẢN LÝ KHO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'thong-ke' ? 'active' : ''}" th:href="@{/thong-ke}">
                            <i class="bi bi-graph-up-arrow me-1"></i> Báo cáo & Thống kê
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'lo-hang' ? 'active' : ''}" th:href="@{/lo-hang}">
                            <i class="bi bi-search me-1"></i> Tra cứu lô hàng
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'san-pham' ? 'active' : ''}" th:href="@{/san-pham}">
                            <i class="bi bi-box me-1"></i> Sản phẩm
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'phieu-nhap' ? 'active' : ''}" th:href="@{/phieunhap}">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Phiếu nhập
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'phieu-xuat' ? 'active' : ''}" th:href="@{/phieuxuat}">
                            <i class="bi bi-box-arrow-up me-1"></i> Phiếu xuất
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'nha-cung-cap' ? 'active' : ''}" th:href="@{/nha-cung-cap}">
                            <i class="bi bi-truck me-1"></i> Nhà cung cấp
                        </a>
                    </li>
                </ul>

                <!-- Khu vực tài khoản (phần mới) -->
                <div class="d-flex align-items-center gap-2">
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/tai-khoan}" class="btn btn-sm btn-danger">
                        <i class="bi bi-people-fill me-1"></i>Quản lý tài khoản
                    </a>
                    <span sec:authorize="isAuthenticated()" class="text-white small d-none d-lg-inline text-truncate" style="max-width: 200px;">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span>
                    </span>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-light">
                            <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div th:fragment="alerts" class="container">
        <!-- Thông báo thành công -->
        <div th:if="${thongBaoThanhCong}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill fs-5"></i>
            <span th:text="${thongBaoThanhCong}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${thongBaoLoi}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <span th:text="${thongBaoLoi}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
</body>
</html>
