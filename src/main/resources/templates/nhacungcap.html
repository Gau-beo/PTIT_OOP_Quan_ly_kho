<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: header('Nhà cung cấp')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container pb-5">
    <h3 class="fw-bold mb-4"><i class="bi bi-truck text-primary me-2"></i>Quản lý Nhà Cung Cấp</h3>

    <div class="card shadow-sm mb-4" sec:authorize="hasRole('ADMIN')">
        <div class="card-header">Thêm nhà cung cấp mới</div>
        <div class="card-body">
            <form th:action="@{/nha-cung-cap/them}" th:object="${nhaCungCapMoi}" method="post" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Tên NCC <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{tenNCC}" class="form-control" maxlength="255" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" th:field="*{diaChi}" class="form-control" maxlength="500">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{sdt}" class="form-control" maxlength="20">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" maxlength="255">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-save me-1"></i>Lưu lại
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">Danh sách nhà cung cấp</div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr><th>ID</th><th>Tên NCC</th><th>Địa chỉ</th><th>SĐT</th><th sec:authorize="hasRole('ADMIN')">Email</th><th class="text-end" sec:authorize="hasRole('ADMIN')">Thao tác</th></tr>
                </thead>
                <tbody>
                    <tr th:each="ncc : ${danhSachNCC}">
                        <td th:text="${ncc.id}"></td>
                        <td th:text="${ncc.tenNCC}"></td>
                        <td th:text="${ncc.diaChi}"></td>
                        <td th:text="${ncc.sdt}"></td>
                        <td sec:authorize="hasRole('ADMIN')" th:text="${ncc.email}"></td>
                        <td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')">
                            <button type="button" class="btn btn-sm btn-outline-primary btn-sua"
                                    th:data-id="${ncc.id}" th:data-ten="${ncc.tenNCC}"
                                    th:data-diachi="${ncc.diaChi}" th:data-sdt="${ncc.sdt}" th:data-email="${ncc.email}">
                                <i class="bi bi-pencil"></i> Sửa
                            </button>
                            <form th:action="@{/nha-cung-cap/xoa/{id}(id=${ncc.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Xóa nhà cung cấp này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(danhSachNCC)}">
                        <td colspan="6" class="text-center text-muted py-4">Chưa có nhà cung cấp nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL: SỬA NHÀ CUNG CẤP (một modal dùng chung, JS điền dữ liệu theo dòng được bấm) -->
<div class="modal fade" id="modalSuaNcc" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="formSuaNcc" method="post" th:action="@{/nha-cung-cap/sua/0}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Sửa nhà cung cấp</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Tên NCC <span class="text-danger">*</span></label>
                        <input type="text" name="tenNCC" id="suaTen" class="form-control" maxlength="255" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" name="diaChi" id="suaDiaChi" class="form-control" maxlength="500">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" name="sdt" id="suaSdt" class="form-control" maxlength="20">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" id="suaEmail" class="form-control" maxlength="255">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var modal = new bootstrap.Modal(document.getElementById('modalSuaNcc'));
        var form = document.getElementById('formSuaNcc');
        var base = form.getAttribute('action').replace(/\/0$/, '/');   // .../nha-cung-cap/sua/
        document.querySelectorAll('.btn-sua').forEach(function (btn) {
            btn.addEventListener('click', function () {
                form.setAttribute('action', base + btn.dataset.id);
                document.getElementById('suaTen').value = btn.dataset.ten || '';
                document.getElementById('suaDiaChi').value = btn.dataset.diachi || '';
                document.getElementById('suaSdt').value = btn.dataset.sdt || '';
                document.getElementById('suaEmail').value = btn.dataset.email || '';
                modal.show();
            });
        });
    })();
</script>
</body>
</html>
