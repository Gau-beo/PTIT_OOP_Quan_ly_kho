<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: header('Nhà cung cấp')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="container pb-5">
    <h3 class="fw-bold mb-4"><i class="bi bi-truck text-primary me-2"></i>Quản lý Nhà Cung Cấp</h3>

    <div class="card shadow-sm mb-4">
        <div class="card-header">Thêm nhà cung cấp mới</div>
        <div class="card-body">
            <form th:action="@{/nha-cung-cap/them}" th:object="${nhaCungCapMoi}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Tên NCC</label>
                    <input type="text" th:field="*{tenNCC}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" th:field="*{diaChi}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{sdt}" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-save me-1"></i>Lưu lại
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">Danh sách nhà cung cấp</div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr><th>ID</th><th>Tên NCC</th><th>Địa chỉ</th><th>SĐT</th></tr>
                </thead>
                <tbody>
                    <tr th:each="ncc : ${danhSachNCC}">
                        <td th:text="${ncc.id}"></td>
                        <td th:text="${ncc.tenNCC}"></td>
                        <td th:text="${ncc.diaChi}"></td>
                        <td th:text="${ncc.sdt}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(danhSachNCC)}">
                        <td colspan="4" class="text-center text-muted py-4">Chưa có nhà cung cấp nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
